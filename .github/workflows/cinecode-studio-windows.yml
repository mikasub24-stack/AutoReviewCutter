name: Cinecode Studio Vietnamese Windows
on:
  workflow_dispatch:
  push:
    branches: [fix/vst3-discovery]
    paths: ['CinecodeStudio/**', '.github/workflows/cinecode-studio-windows.yml']
permissions:
  contents: read
concurrency:
  group: cinecode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path "$env:RUNNER_TEMP/cinecode-build.log" | Out-Null
          trap {
            if ($env:CINECODE_SMOKE_REPORT -and (Test-Path $env:CINECODE_SMOKE_REPORT)) {
              $smoke = (Get-Content $env:CINECODE_SMOKE_REPORT -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=Cinecode app smoke report::$smoke"
            }
            $exception = ($_ | Out-String) + $_.ScriptStackTrace
            $exception = $exception.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Cinecode exception::$exception"
            Stop-Transcript | Out-Null
            $detail = (Get-Content "$env:RUNNER_TEMP/cinecode-build.log" -Tail 75) -join "`n"
            $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Cinecode Windows build::$detail"
            exit 1
          }
          python -m venv .venv-cinecode
          $env:PATH = (Join-Path (Get-Location) '.venv-cinecode/Scripts') + [IO.Path]::PathSeparator + $env:PATH
          python -m pip install --require-hashes --only-binary=:all: -r CinecodeStudio/requirements-windows.lock
          if ($LASTEXITCODE) { throw 'pip failed' }
          New-Item -ItemType Directory -Force CinecodeStudio/runtime | Out-Null
          Copy-Item (Get-Command node).Source CinecodeStudio/runtime/node.exe
          $nodeHash = (Get-FileHash CinecodeStudio/runtime/node.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeHash -ne 'dccc52de28d8df2ee22d2062424f8c563070d95d8ad70c54c4bf01d590dec14f') { throw 'Node binary differs from official v22.23.4 win-x64 release checksum' }
          $encoder = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $encoder CinecodeStudio/runtime/ffmpeg.exe
          python -c "import importlib.metadata,pathlib; dest=pathlib.Path('CinecodeStudio/runtime'); [(dest/(pkg+'-'+pathlib.Path(str(p)).name)).write_bytes(d.locate_file(p).read_bytes()) for pkg in ('customtkinter','darkdetect','Pillow') for d in [importlib.metadata.distribution(pkg)] for p in d.files if 'license' in str(p).lower() and d.locate_file(p).is_file()]"
          Invoke-WebRequest 'https://raw.githubusercontent.com/nodejs/node/v22.23.4/LICENSE' -OutFile CinecodeStudio/runtime/NODE-LICENSE.txt
          python -c "import importlib.metadata,pathlib; d=importlib.metadata.distribution('imageio-ffmpeg'); dest=pathlib.Path('CinecodeStudio/runtime'); [(dest / ('FFMPEG-'+pathlib.Path(str(p)).name)).write_bytes(d.locate_file(p).read_bytes()) for p in d.files if 'license' in str(p).lower() or 'readme' in str(p).lower()]"
          & CinecodeStudio/runtime/ffmpeg.exe -version 2>&1 | Out-File CinecodeStudio/runtime/FFMPEG-BUILD.txt -Encoding utf8
          'Binary distributor and corresponding source/build information: https://github.com/imageio/imageio-binaries/tree/master/ffmpeg . FFmpeg source: https://ffmpeg.org/download.html#get-sources . Exact build/version in FFMPEG-BUILD.txt.' | Set-Content CinecodeStudio/runtime/FFMPEG-README.txt -Encoding utf8
          & ./CinecodeStudio/scripts/prepare_upstream_runtime.ps1
          if ($LASTEXITCODE) { throw 'Original-tool runtime preparation failed' }
          python -m unittest discover -s CinecodeStudio/tests -v 2>&1 | Tee-Object -Variable coreOutput
          if ($LASTEXITCODE) {
            $detail = ($coreOutput | Out-String)
            if ($detail.Length -gt 14000) { $detail = $detail.Substring($detail.Length - 14000) }
            $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Cinecode core tests::$detail"
            throw 'Core tests failed'
          }
          $env:CINECODE_SCREENSHOT = Join-Path (Get-Location) 'dist-cinecode/UI-Preview.png'
          $env:CINECODE_SMOKE_REPORT = Join-Path (Get-Location) 'dist-cinecode/SmokeTest.json'
          python CinecodeStudio/app.py --smoke-test
          if ($LASTEXITCODE) { throw 'GUI test failed' }
          python CinecodeStudio/tests/render_smoke.py 2>&1 | Tee-Object -Variable renderOutput
          if ($LASTEXITCODE) {
            $detail = ($renderOutput | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Cinecode render output::$detail"
            throw 'Real render test failed'
          }
          python CinecodeStudio/tests/upstream_render_smoke.py
          if ($LASTEXITCODE) { throw 'Original Three.js engine test failed' }
          python -m PyInstaller --noconfirm --windowed --clean --noupx --version-file CinecodeStudio/version-info.txt --collect-all customtkinter --collect-all darkdetect --name CinecodeStudio --icon CinecodeStudio/icon.ico --distpath CinecodeStudio/build --workpath CinecodeStudio/pybuild --specpath . --add-data 'CinecodeStudio/icon.ico;.' --add-data 'CinecodeStudio/film.html;.' --add-data 'CinecodeStudio/vendor;vendor' --add-data 'CinecodeStudio/runtime;runtime' CinecodeStudio/app.py
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          Copy-Item CinecodeStudio/README.vi.md,CinecodeStudio/THIRD-PARTY.md CinecodeStudio/build/CinecodeStudio/
          $p = Start-Process CinecodeStudio/build/CinecodeStudio/CinecodeStudio.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode) { throw 'Packaged GUI failed' }
          python CinecodeStudio/scripts/build_manifest.py CinecodeStudio/build/CinecodeStudio
          if ($LASTEXITCODE) { throw 'Build manifest failed' }
          Copy-Item CinecodeStudio/build/CinecodeStudio/BuildManifest.json dist-cinecode/BuildManifest.json
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' CinecodeStudio/installer.iss
          if ($LASTEXITCODE) { throw 'Installer failed' }
          $install = Join-Path $env:RUNNER_TEMP 'Cinecode-installed'
          $p = Start-Process dist-cinecode/CinecodeStudio-0.2.1-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($p.ExitCode) { throw 'Installation failed' }
          $p = Start-Process "$install/CinecodeStudio.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode) { throw 'Installed GUI failed' }
          & ./VocalStudio/scripts/scan-windows.ps1 -RuntimeDirectory CinecodeStudio/build/CinecodeStudio -PackageDirectory dist-cinecode
          & git archive '--format=zip' '--output=dist-cinecode/CinecodeStudio-0.2.1-Source.zip' HEAD CinecodeStudio .github/workflows/cinecode-studio-windows.yml VocalStudio/scripts/scan-windows.ps1
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          Get-FileHash dist-cinecode/* -Algorithm SHA256 | Format-List | Out-File $env:GITHUB_STEP_SUMMARY -Append
          'Core, GUI, real Chromium/FFmpeg render, deterministic frame, packaged GUI and installed GUI checks passed.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: CinecodeStudio-0.2.1-Installer
          path: dist-cinecode/*
          if-no-files-found: error
