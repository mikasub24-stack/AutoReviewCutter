name: Vocal Studio Windows
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths:
      - 'VocalStudio/**'
      - '.github/workflows/vocal-studio-windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: build/vocal
          key: vocal-browser156-v1-${{ github.sha }}
          restore-keys: vocal-browser156-v1-
      - name: Configure native Windows app and ASIO
        run: cmake -S VocalStudio -B build/vocal -A x64 -DVOCAL_BUILD_TESTS=ON
      - name: Build app and test VST3
        run: cmake --build build/vocal --config Release --parallel 2
      - name: Verify DSP, pitch, recording, project round-trip and plugin latency
        run: ctest --test-dir build/vocal -C Release --output-on-failure
      - name: Verify sandboxed browser audio capture
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/vocal/VocalStudio_artefacts/Release/VocalStudio.exe').Path
          Remove-Item (Join-Path (Split-Path $app) 'BrowserSelfTest.json') -ErrorAction SilentlyContinue
          $p = Start-Process $app -WorkingDirectory $PWD -ArgumentList @('--browser-probe','--autoplay-policy=no-user-gesture-required') -PassThru
          if (!$p.WaitForExit(45000)) { $p.Kill(); throw 'Browser audio probe timed out' }
          # CEF bootstrap changes the process working directory to its executable folder.
          $browserDir = Split-Path $app
          if (Test-Path "$browserDir/BrowserSelfTest.json") { Copy-Item "$browserDir/BrowserSelfTest.json" BrowserSelfTest.json }
          Write-Host "Browser exit: $($p.ExitCode)"
          if (Test-Path "$browserDir/BrowserStartup.log") { Get-Content "$browserDir/BrowserStartup.log" }
          if (Test-Path "$browserDir/BrowserRuntime.log") { Get-Content "$browserDir/BrowserRuntime.log" -Tail 100 }
          if ($p.ExitCode -ne 0 -or !(Test-Path BrowserSelfTest.json)) { throw 'Browser audio capture failed' }
          Get-Content BrowserSelfTest.json
          $probe = Get-Content BrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$probe.passed) { throw 'Browser returned a failed signal verification' }
      - name: Capture actual application UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $app = (Resolve-Path 'build/vocal/VocalStudio_artefacts/Release/VocalStudio.exe').Path
          $shot = Join-Path $PWD 'dist/VocalStudio-preview.jpg'
          $p = Start-Process $app -WorkingDirectory $PWD -ArgumentList @('--screenshot', "`"$shot`"") -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'UI screenshot timed out' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $shot)) { throw 'UI screenshot failed' }
      - name: Capture advanced Studio UI and effects
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/vocal/VocalStudio_artefacts/Release/VocalStudio.exe').Path
          $shot = Join-Path $PWD 'dist/VocalStudio-Studio.jpg'
          $p = Start-Process $app -WorkingDirectory $PWD -ArgumentList @('--demo','--screenshot',"`"$shot`"") -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Studio screenshot timed out' }
          if ($p.ExitCode -ne 0) { throw 'Studio screenshot failed' }
      - name: Build portable package and installer
        shell: pwsh
        run: |
          $appDir = (Resolve-Path 'build/vocal/VocalStudio_artefacts/Release').Path
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item "$appDir/*" dist/portable/ -Recurse
          Remove-Item dist/portable/*.lib,dist/portable/*.pdb,dist/portable/*.exp,dist/portable/bootstrap*.exe,dist/portable/Browser*.json,dist/portable/Browser*.log,dist/portable/debug.log -ErrorAction SilentlyContinue
          Copy-Item VocalStudio/README.md,VocalStudio/LICENSE.txt,VocalStudio/THIRD_PARTY.md,VocalStudio/JUCE-LICENSE.md,VocalStudio/ThirdParty/Signalsmith-Stretch-LICENSE.txt,VocalStudio/ThirdParty/Signalsmith-Linear-LICENSE.txt dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath dist/VocalStudio-1.4.1-Windows.zip
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $iscc "/DSourceDir=$appDir" "/DOutputDir=$PWD\dist" VocalStudio/installer/VocalStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test installed executable
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'VocalStudioInstalled'
          $setup = Start-Process "$PWD/dist/VocalStudio-1.4.1-Setup.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$install/VocalStudio.exe")) { throw 'Installer failed' }
          $report = Join-Path $PWD 'dist/InstalledSelfTest.json'
          $test = Start-Process "$install/VocalStudio.exe" -WorkingDirectory $PWD -ArgumentList @('--self-test','--report',"`"$report`"") -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Installed executable self-test failed' }
          $browser = Start-Process "$install/VocalStudio.exe" -WorkingDirectory $PWD -ArgumentList @('--browser-probe','--autoplay-policy=no-user-gesture-required') -PassThru
          if (!$browser.WaitForExit(45000)) { $browser.Kill(); throw 'Installed browser probe timed out' }
          if ($browser.ExitCode -ne 0) { throw 'Installed Chromium runtime/sandbox/audio probe failed' }
          Copy-Item "$install/BrowserSelfTest.json" dist/InstalledBrowserSelfTest.json
          $probe = Get-Content dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$probe.passed) { throw 'Installed browser returned a failed signal verification' }
      - name: Export corresponding source and workspace handoff
        shell: pwsh
        run: |
          git archive --format=zip --output=dist/VocalStudio-1.4.1-Source.zip HEAD VocalStudio .github/workflows/vocal-studio-windows.yml
          git fetch --no-tags --unshallow origin vocal-studio
          if ($LASTEXITCODE -ne 0) { throw 'Source history fetch failed' }
          git bundle create dist/VocalStudio-source.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VocalStudio-Windows
          path: |
            dist/*.exe
            dist/*Windows.zip
            dist/*Source.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VocalStudio-Review
          path: |
            dist/*.jpg
            dist/*.bundle
            dist/*SelfTest.json
            BrowserSelfTest.json
            Browser*.log
            debug.log
            build/vocal/EngineSelfTest.json
            build/vocal/Testing/Temporary/LastTest.log
            build/vocal/VocalStudio_artefacts/Release/debug.log
            build/vocal/VocalStudio_artefacts/Release/Browser*.log
            build/vocal/VocalStudio_artefacts/Release/Browser*Test.json
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/vocal
          key: vocal-browser156-v1-${{ github.sha }}
