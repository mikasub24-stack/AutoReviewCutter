name: Hunyuan Local Studio Windows
on:
  workflow_dispatch:
  push:
    branches: [fix/vst3-discovery]
    paths: ['WanLocalStudio/**', '.github/workflows/wan-local-studio-windows.yml']
permissions:
  contents: write
concurrency:
  group: wan-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-wan | Out-Null
          Start-Transcript -Path "$env:RUNNER_TEMP/wan-build.log" | Out-Null
          trap {
            $detail = (Get-Content "$env:RUNNER_TEMP/wan-build.log" -Tail 80) -join "`n"
            $detail += ($_ | Out-String) + $_.ScriptStackTrace
            if (Test-Path $env:WAN_SMOKE_REPORT) { $detail += Get-Content $env:WAN_SMOKE_REPORT -Raw }
            $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Wan Local Windows build::$detail"
            exit 1
          }
          python -m venv .venv-wan
          $env:PATH = (Join-Path (Get-Location) '.venv-wan/Scripts') + [IO.Path]::PathSeparator + $env:PATH
          $env:WAN_SMOKE_REPORT = Join-Path (Get-Location) 'dist-wan/SmokeError.txt'
          $env:WAN_UI_PREVIEW = Join-Path (Get-Location) 'dist-wan/UI-Preview.png'
          python -m pip install --require-hashes --only-binary=:all: -r WanLocalStudio/requirements-windows.lock
          if ($LASTEXITCODE) { throw 'pip failed' }
          python -m pip install --require-hashes --no-build-isolation --no-deps -r WanLocalStudio/compiler-windows.lock
          if ($LASTEXITCODE) { throw 'Pinned source compiler install failed' }
          New-Item -ItemType Directory -Force WanLocalStudio/runtime | Out-Null
          $encoder = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $encoder WanLocalStudio/runtime/ffmpeg.exe
          $sevenCandidates = @((Join-Path $env:ProgramFiles '7-Zip/7z.exe'), (Get-Command 7z.exe).Source)
          $sevenZip = $sevenCandidates | Where-Object { (Test-Path $_) -and (Test-Path (Join-Path (Split-Path $_) '7z.dll')) } | Select-Object -First 1
          if (!$sevenZip) { throw 'Cannot locate a complete 7-Zip installation (not the Chocolatey shim)' }
          $sevenRoot = Split-Path $sevenZip
          Copy-Item $sevenZip WanLocalStudio/runtime/7z.exe
          Copy-Item (Join-Path $sevenRoot '7z.dll') WanLocalStudio/runtime/7z.dll
          New-Item -ItemType Directory -Force WanLocalStudio/runtime/licenses | Out-Null
          Copy-Item (Join-Path $sevenRoot 'License.txt') WanLocalStudio/runtime/licenses/7-Zip-License.txt
          Copy-Item WanLocalStudio/vendor/7zip-COPYING.txt WanLocalStudio/runtime/licenses/7-Zip-LGPL.txt
          if (Test-Path (Join-Path $sevenRoot 'copying.txt')) { Copy-Item (Join-Path $sevenRoot 'copying.txt') WanLocalStudio/runtime/licenses/7-Zip-copying.txt }
          & WanLocalStudio/runtime/ffmpeg.exe -version 2>&1 | Out-File WanLocalStudio/runtime/FFMPEG-BUILD.txt -Encoding utf8
          python WanLocalStudio/build_assets.py
          if ($LASTEXITCODE) { throw 'Build assets failed' }
          python -m unittest discover -s WanLocalStudio/tests -v
          if ($LASTEXITCODE) { throw 'Engine tests failed' }
          python WanLocalStudio/app.py --smoke-test
          if ($LASTEXITCODE) { throw 'Source GUI smoke failed' }
          python -m nuitka --standalone --msvc=latest --jobs=3 --enable-plugin=tk-inter --include-package=customtkinter --include-package=darkdetect --include-package-data=customtkinter --windows-console-mode=disable --windows-icon-from-ico=WanLocalStudio/icon.ico --output-filename=WanLocalStudio.exe --output-dir=WanLocalStudio/compiled --include-data-files=WanLocalStudio/icon.ico=icon.ico --include-data-dir=WanLocalStudio/vendor=vendor --company-name='Hunyuan Local Studio contributors' --product-name='Hunyuan Local Studio' --file-description='Hunyuan Local Studio - local video generator' --file-version=0.3.2.0 --product-version=0.3.2 --assume-yes-for-downloads WanLocalStudio/app.py 2>&1 | Tee-Object -Variable packOutput
          if ($LASTEXITCODE) {
            $detail = (($packOutput | Select-Object -Last 60) | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Wan native compiler::$detail"
            throw 'Native compilation failed'
          }
          $native = @(Get-ChildItem WanLocalStudio/compiled -Directory -Filter '*.dist')
          if ($native.Count -ne 1) { throw 'Expected one standalone native distribution' }
          New-Item -ItemType Directory -Force WanLocalStudio/build/WanLocalStudio | Out-Null
          Copy-Item (Join-Path $native[0].FullName '*') WanLocalStudio/build/WanLocalStudio/ -Recurse -Force
          Copy-Item WanLocalStudio/runtime WanLocalStudio/build/WanLocalStudio/runtime -Recurse -Force
          Copy-Item WanLocalStudio/README.vi.md,WanLocalStudio/THIRD-PARTY.md WanLocalStudio/build/WanLocalStudio/
          $p = Start-Process WanLocalStudio/build/WanLocalStudio/WanLocalStudio.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode) { throw 'Packaged GUI smoke failed' }
          python WanLocalStudio/build_assets.py --manifest WanLocalStudio/build/WanLocalStudio
          if ($LASTEXITCODE) { throw 'Manifest failed' }
          Copy-Item WanLocalStudio/build/WanLocalStudio/BuildManifest.json dist-wan/BuildManifest.json
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' WanLocalStudio/installer.iss
          if ($LASTEXITCODE) { throw 'Installer failed' }
          $install = Join-Path $env:RUNNER_TEMP 'WanLocal-installed'
          $p = Start-Process dist-wan/HunyuanLocalStudio-0.3.2-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($p.ExitCode) { throw 'Installation failed' }
          $p = Start-Process "$install/WanLocalStudio.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode) { throw 'Installed GUI smoke failed' }
          & ./VocalStudio/scripts/scan-windows.ps1 -RuntimeDirectory WanLocalStudio/build/WanLocalStudio -PackageDirectory dist-wan
          & git archive '--format=zip' '--output=dist-wan/HunyuanLocalStudio-0.3.2-Source.zip' HEAD WanLocalStudio .github/workflows/wan-local-studio-windows.yml VocalStudio/scripts/scan-windows.ps1
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          Get-ChildItem dist-wan -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content dist-wan/SHA256SUMS.txt -Encoding utf8
          Get-FileHash dist-wan/* -Algorithm SHA256 | Format-List | Out-File $env:GITHUB_STEP_SUMMARY -Append
          'Tests use simulated ComfyUI responses and real FFmpeg. GPU inference and identity consistency are NOT verified by this build.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: HunyuanLocalStudio-0.3.2-Installer
          path: dist-wan/*
          if-no-files-found: error
      - name: Publish installer with a direct release download URL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'hunyuan-local-studio-v0.3.2'
          $notes = @'
          Bản thử 0.3.2 giữ 720p gốc/50 bước. Bỏ ép Qwen chạy CPU: mã hóa chữ dùng default device, backend normal VRAM/reserve 1GB vẫn tự offload. Khi tạo mới, T2V tạo một ảnh nhân vật trước thay vì 121 khung; tiếp theo I2V tạo chuyển động. Không dùng Wan hoặc ảnh Wan.

          Hiện tiến độ thật theo prompt_id: nạp model, mã hóa chữ, sampling step/max và giải mã. Nút Kiểm tra GPU / log hiển thị số đo NVIDIA, log lưu và xuất chẩn đoán. Không khẳng định tác vụ treo chỉ từ thời gian chờ.

          Đóng app cũ. Nếu còn tác vụ cũ, dùng Xóa dự án đang tạo chọn thư mục cũ và xác nhận dừng/xóa trước, rồi Tạo video mới để áp dụng cấu hình. Backend riêng chỉ được khởi động lại khi rỗng queue và đúng process của bộ cài này. Model đã tải được dùng lại.

          Chưa benchmark inference trên RTX 3060 12GB; vẫn có thể chậm, thiếu VRAM hoặc biến dạng. Tencent công bố 14GB tối thiểu cho bản gốc. Đây là sửa cấu hình/tiến độ, không phải cam kết tốc độ hay chất lượng.

          Tải HunyuanLocalStudio-0.3.2-Setup.exe. SHA-256, kết quả Defender và mã nguồn tương ứng được đính kèm.

          Bộ cài chưa ký số nhà phát hành. Chưa xác nhận Chrome/Cốc Cốc chấp nhận file mới; kết quả Defender không thay thế kết quả kiểm tra của trình duyệt. Chưa thử tải toàn bộ model hoặc inference trên RTX 3060 thật.
          '@
          $notes | Set-Content "$env:RUNNER_TEMP/wan-release.md" -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Version already published; never replace an existing public installer' }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Hunyuan Local Studio 0.3.2' --notes-file "$env:RUNNER_TEMP/wan-release.md"
            if ($LASTEXITCODE) { throw 'Draft release failed' }
          }
          & gh release upload $tag --repo $env:GITHUB_REPOSITORY dist-wan/HunyuanLocalStudio-0.3.2-Setup.exe dist-wan/HunyuanLocalStudio-0.3.2-Source.zip dist-wan/SHA256SUMS.txt dist-wan/DefenderReport.json dist-wan/BuildManifest.json --clobber
          if ($LASTEXITCODE) { throw 'Release asset upload failed' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --notes-file "$env:RUNNER_TEMP/wan-release.md"
          if ($LASTEXITCODE) { throw 'Publish release failed' }
