name: Build AnimStudio installer
on:
  workflow_dispatch:
  push:
    branches: [animstudio-build]
    paths:
      - 'AnimStudio/**'
      - '.github/workflows/animstudio-windows.yml'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: AnimStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          Write-Host "Inno Setup: $iscc"
      - name: Build AnimStudio (PyInstaller) + self-test + Setup.exe
        shell: pwsh
        env:
          NO_NUITKA: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          cmd /c "build.bat < nul" 2>&1 | Tee-Object -FilePath build.log
          $ver = (python thongtin_ban.py).Trim()
          Write-Host "Version: $ver"
          $setup = "dist\AnimStudio_Setup_$ver.exe"
          if (-not (Test-Path $setup)) { throw "Setup not created: $setup (see build.log)" }
          Write-Host ("Setup size: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB))
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimStudio-build-log
          path: AnimStudio/build.log
          retention-days: 14
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimStudio-Windows-Setup
          path: AnimStudio/dist/AnimStudio_Setup_*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish setup download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (python thongtin_ban.py).Trim()
          $setup = "dist\AnimStudio_Setup_$ver.exe"
          $tag = "animstudio-v$ver"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $setup --target $env:GITHUB_SHA --title "AnimStudio $ver - Windows Setup" --notes "AnimStudio $ver Windows installer (Setup.exe). Built by GitHub Actions from the source in the AnimStudio folder; the built app passes its own --selftest before the installer is created."
          } else {
            gh release upload $tag $setup --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
