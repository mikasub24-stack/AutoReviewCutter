name: Auto Studio Direct Scan Patch
on:
  workflow_dispatch:
  push:
    branches: [fix/autostudio-direct-scan]
    paths: ['AutoStudioDirectPatch/**', '.github/workflows/autostudio-direct-scan-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source and package only changed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s AutoStudioDirectPatch/source/tests -v
          if ($LASTEXITCODE) { throw 'API/source tests failed' }
          python AutoStudioDirectPatch/source/tests/gui_contract.py
          if ($LASTEXITCODE) { throw 'Scan-tab UI contract failed (simulated theme/downloader)' }
          python AutoStudioDirectPatch/package_patch.py
          if ($LASTEXITCODE) { throw 'ZIP packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-2.2.52-Direct-Scan-Source-Patch
          path: AutoStudioDirectPatch/dist/*
          if-no-files-found: error
      - name: Publish downloadable patch ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autostudio-v2.2.52-creator-catalog-patch'
          @'
          Đọc trực tiếp danh sách 合集 của kênh qua /aweme/v1/web/mix/list/: tên, ảnh bìa, số tập và thứ tự từ mix_infos, thay cho suy ra bộ từ từng bài đăng. Với dữ liệu mẫu tương ứng ảnh người dùng, hiện 4 bộ 25/20/54/40 tập (139 tập trong bộ); 14 bài đăng ngoài bộ không chen vào danh sách 合集. Chỉ khi chọn bộ mới lấy tập/link qua mix/aweme. Giữ nguyên bố cục và mẫu tên Tập 001 - tên bộ.

          Đối chiếu số video thực nhận với số tập catalog; thiếu thì báo chưa đủ. Catalog rỗng hợp lệ mới chuyển sang bài đăng với status nguồn dự phòng rõ ràng; lỗi HTTP/schema không giả thành danh sách rỗng. API có owner sai bị lọc và báo chưa đủ. Contract endpoint/schema đối chiếu nguồn Evil0ctal/Douyin_TikTok_Download_API commit 3c045e11. Chưa gọi trực tiếp catalog thật trên môi trường build vì mạng chặn Douyin.

          Đã kiểm tra 83 trường hợp ngoại tuyến và luồng Tk bằng theme/downloader mô phỏng: catalog 4 bộ, chọn bộ 25 tập, đặt tên và chuyển tải; giữ kiểm thử quét dở/phân trang trước. Bộ ký giữ nguyên bản đã hoạt động. Đây không phải xác nhận đã đối chiếu trực tiếp catalog của kênh người dùng. Có báo cáo và checksum.

          Tải AutoStudio_v2.2.52_chi_file_sua.zip, giải nén đè vào bộ mã nguồn 2.2.51 (hoặc 2.2.50) rồi chạy/build lại theo dự án của bạn. Đây không phải EXE; chép .py cạnh EXE đã biên dịch không tự áp dụng bản vá.
          '@ | Set-Content "$env:RUNNER_TEMP/scan-patch.md" -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Never overwrite published patch release' }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Auto Studio 2.2.52 - Danh sách bộ từ mục 合集 của kênh' --notes-file "$env:RUNNER_TEMP/scan-patch.md"
            if ($LASTEXITCODE) { throw 'Draft creation failed' }
          }
          & gh release upload $tag --repo $env:GITHUB_REPOSITORY AutoStudioDirectPatch/dist/* --clobber
          if ($LASTEXITCODE) { throw 'Patch upload failed' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Publication failed' }
