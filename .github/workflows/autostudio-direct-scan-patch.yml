name: Auto Studio Direct Scan Patch
on:
  workflow_dispatch:
  push:
    branches: [fix/autostudio-direct-scan]
    paths: ['AutoStudioDirectPatch/**', '.github/workflows/autostudio-direct-scan-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source and package only changed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s AutoStudioDirectPatch/source/tests -v
          if ($LASTEXITCODE) { throw 'API/source tests failed' }
          python AutoStudioDirectPatch/source/tests/gui_contract.py
          if ($LASTEXITCODE) { throw 'Scan-tab UI contract failed (simulated theme/downloader)' }
          python AutoStudioDirectPatch/package_patch.py
          if ($LASTEXITCODE) { throw 'ZIP packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-2.5.50-Direct-Scan-Source-Patch
          path: AutoStudioDirectPatch/dist/*
          if-no-files-found: error
      - name: Publish downloadable patch ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autostudio-v2.5.50-direct-api-patch'
          @'
          Sửa thứ tự và tên tập của bộ Douyin. Khi Lấy link bộ, đọc danh sách trực tiếp từ API /mix/aweme thay cho thứ tự bài đăng mới-cũ trên kênh. Ưu tiên metadata số tập riêng biệt; nếu metadata lặp tổng tập thì dùng thứ tự playlist do API bộ trả. Tên file <Tên bộ> - Tập 001, 002…; chọn tập lẻ giữ nguyên số. URL đã có trong tab tải được cập nhật tên/link ở trạng thái chờ, sắp lại thứ tự riêng các mục của bộ. Không đổi tên file đang tải hoặc đã hoàn tất trên đĩa.

          Giữ nguyên giao diện, lõi tải và bộ ký 2.5.49 đã được người dùng xác nhận quét/tải được. Bản sửa thứ tự 2.5.50 chưa chạy trực tiếp trên môi trường build; kiểm thử dữ liệu mô phỏng và luồng Tk thực với theme/downloader giả lập. Sau cập nhật hãy Quét và Lấy lại bộ trước khi tải.

          Đã kiểm tra 61 trường hợp ngoại tuyến và hợp đồng giao diện bằng theme/downloader mô phỏng. Chưa thử Douyin thật, chưa xác nhận thuật toán ký hiện được máy chủ chấp nhận; không có tự giải CAPTCHA. Có báo cáo và checksum trong release.

          Tải AutoStudio_v2.5.50_chi_file_sua.zip, giải nén đè vào bộ mã nguồn 2.5.45 rồi chạy/build lại theo dự án của bạn. Đây không phải EXE; chép .py cạnh EXE đã biên dịch không tự áp dụng bản vá.
          '@ | Set-Content "$env:RUNNER_TEMP/scan-patch.md" -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Never overwrite published patch release' }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Auto Studio 2.5.50 - Đúng thứ tự tập Douyin và tên file tải' --notes-file "$env:RUNNER_TEMP/scan-patch.md"
            if ($LASTEXITCODE) { throw 'Draft creation failed' }
          }
          & gh release upload $tag --repo $env:GITHUB_REPOSITORY AutoStudioDirectPatch/dist/* --clobber
          if ($LASTEXITCODE) { throw 'Patch upload failed' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Publication failed' }
