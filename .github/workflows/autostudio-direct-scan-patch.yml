name: Auto Studio Direct Scan Patch
on:
  workflow_dispatch:
  push:
    branches: [fix/autostudio-direct-scan]
    paths: ['AutoStudioDirectPatch/**', '.github/workflows/autostudio-direct-scan-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source and package only changed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s AutoStudioDirectPatch/source/tests -v
          if ($LASTEXITCODE) { throw 'API/source tests failed' }
          python AutoStudioDirectPatch/source/tests/gui_contract.py
          if ($LASTEXITCODE) { throw 'Scan-tab UI contract failed (simulated theme/downloader)' }
          python AutoStudioDirectPatch/package_patch.py
          if ($LASTEXITCODE) { throw 'ZIP packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-2.5.48-Direct-Scan-Source-Patch
          path: AutoStudioDirectPatch/dist/*
          if-no-files-found: error
      - name: Publish downloadable patch ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autostudio-v2.5.48-direct-api-patch'
          @'
          Bản vá khởi tạo phiên: khi chưa có msToken trong cookie, xin token từ dịch vụ SDK trước khi gọi API danh sách. Không gửi cookie đăng nhập sang host SDK, không tái sử dụng token mẫu, không sinh token ngẫu nhiên. Token trả về giữ trong bộ nhớ; nếu không được cấp token thì báo lỗi và dừng. Giữ nguyên giao diện và luồng quét trực tiếp, không tự mở trình duyệt.

          Chưa xác nhận hết HTTP 403 trên Douyin thật. Lần thử mạng tới SDK tại môi trường build bị gateway chặn trước khi tới dịch vụ; mẫu SDK tĩnh và bộ ký chưa được kiểm chứng với máy chủ hiện tại. Đây là bản vá khởi tạo phiên để chạy thử, không phải xác nhận đã quét thành công. Thay cho nguồn 2.5.45/2.5.46/2.5.47.

          Đã kiểm tra 45 trường hợp ngoại tuyến và hợp đồng giao diện bằng theme/downloader mô phỏng. Chưa thử Douyin thật, chưa xác nhận thuật toán ký hiện được máy chủ chấp nhận; không có tự giải CAPTCHA. Có báo cáo và checksum trong release.

          Tải AutoStudio_v2.5.48_chi_file_sua.zip, giải nén đè vào bộ mã nguồn 2.5.45 rồi chạy/build lại theo dự án của bạn. Đây không phải EXE; chép .py cạnh EXE đã biên dịch không tự áp dụng bản vá.
          '@ | Set-Content "$env:RUNNER_TEMP/scan-patch.md" -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Never overwrite published patch release' }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Auto Studio 2.5.48 - Khởi tạo phiên SDK (chưa xác nhận quét thật)' --notes-file "$env:RUNNER_TEMP/scan-patch.md"
            if ($LASTEXITCODE) { throw 'Draft creation failed' }
          }
          & gh release upload $tag --repo $env:GITHUB_REPOSITORY AutoStudioDirectPatch/dist/* --clobber
          if ($LASTEXITCODE) { throw 'Patch upload failed' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Publication failed' }
