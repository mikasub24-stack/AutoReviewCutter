name: Auto Studio Direct Scan Patch
on:
  workflow_dispatch:
  push:
    branches: [fix/autostudio-direct-scan]
    paths: ['AutoStudioDirectPatch/**', '.github/workflows/autostudio-direct-scan-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source and package only changed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s AutoStudioDirectPatch/source/tests -v
          if ($LASTEXITCODE) { throw 'API/source tests failed' }
          python AutoStudioDirectPatch/source/tests/gui_contract.py
          if ($LASTEXITCODE) { throw 'Scan-tab UI contract failed (simulated theme/downloader)' }
          python AutoStudioDirectPatch/package_patch.py
          if ($LASTEXITCODE) { throw 'ZIP packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-2.2.50-Direct-Scan-Source-Patch
          path: AutoStudioDirectPatch/dist/*
          if-no-files-found: error
      - name: Publish downloadable patch ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autostudio-v2.2.50-episode-prefix-patch'
          @'
          Đổi tên file thành Tập 001 - <tên bộ>, Tập 002 - <tên bộ>…: số tập đứng trước tên tiếng Trung. Số phiên bản 2.2.50 do người dùng yêu cầu. Giữ nguyên thứ tự Douyin, giao diện và bộ ký của 2.5.50; giữ số khi chọn tập lẻ và chuyển tải.

          Gói file nguồn sửa cho 2.5.50. Chép đè rồi build/chạy lại; Quét → Lấy lại bộ → Tải bộ này để dùng tên mới. Cập nhật tên mục chờ trong hàng đợi; không tự đổi tên file đã tải xong trên đĩa. Trong Explorer, chọn Sắp xếp → Tên → Tăng dần; Nhóm theo → Không để không bị phân nhóm theo ngày tải.

          Đã kiểm tra 61 trường hợp ngoại tuyến và hợp đồng giao diện bằng theme/downloader mô phỏng. Chưa thử Douyin thật, chưa xác nhận thuật toán ký hiện được máy chủ chấp nhận; không có tự giải CAPTCHA. Có báo cáo và checksum trong release.

          Tải AutoStudio_v2.2.50_chi_file_sua.zip, giải nén đè vào bộ mã nguồn 2.5.50 rồi chạy/build lại theo dự án của bạn. Đây không phải EXE; chép .py cạnh EXE đã biên dịch không tự áp dụng bản vá.
          '@ | Set-Content "$env:RUNNER_TEMP/scan-patch.md" -Encoding utf8
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Never overwrite published patch release' }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Auto Studio 2.2.50 - Tập 001 đứng trước tên bộ' --notes-file "$env:RUNNER_TEMP/scan-patch.md"
            if ($LASTEXITCODE) { throw 'Draft creation failed' }
          }
          & gh release upload $tag --repo $env:GITHUB_REPOSITORY AutoStudioDirectPatch/dist/* --clobber
          if ($LASTEXITCODE) { throw 'Patch upload failed' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Publication failed' }
