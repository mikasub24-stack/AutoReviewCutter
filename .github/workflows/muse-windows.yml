name: Build Muse Video Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [main, muse-video-studio]
    paths:
      - 'MuseVideoStudio/src/**'
      - 'MuseVideoStudio/test/**'
      - 'MuseVideoStudio/package.json'
      - 'MuseVideoStudio/package-lock.json'
      - '.github/workflows/muse-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MuseVideoStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MuseVideoStudio/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test queue, profiles, browser adapters and script planner
        shell: cmd
        run: |
          call npm test > test.log 2>&1
          set MUSE_TEST_EXIT=%ERRORLEVEL%
          type test.log
          exit /b %MUSE_TEST_EXIT%
      - name: Verify send controls and video cards in Edge
        shell: cmd
        run: |
          set "CHROMIUM_PATH=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if not exist "%CHROMIUM_PATH%" set "CHROMIUM_PATH=C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          call node test/submit-diagnostics-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/attachment-input-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/native-upload-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/scene-flow-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/browser-probe-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/browser-stop-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/attachment-ready-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          set "MUSE_TRACKER_VIDEO_FIXTURE=test\fixtures\solid-blue.webm"
          call node test/muse-tracker-smoke.cjs >> test.log 2>&1
          if errorlevel 1 (type test.log & exit /b 1)
          call node test/cards-smoke.cjs >> test.log 2>&1
          set MUSE_BROWSER_EXIT=%ERRORLEVEL%
          type test.log
          exit /b %MUSE_BROWSER_EXIT%
      - name: Build portable Windows app
        run: npm run dist:win
      - name: Verify launcher and app EXE icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $iconPath = (Resolve-Path "src/assets/muse-studio.ico").Path
          $files = @("dist/MuseVideoStudio-$version-Windows.exe", "dist/win-unpacked/Muse Video Studio.exe")
          try {
            foreach ($file in $files) {
              $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $file).Path)
              if (-not $actualIcon) { throw "No embedded icon: $file" }
              $expectedIcon = [System.Drawing.Icon]::new($iconPath, $actualIcon.Size)
              $actual = $actualIcon.ToBitmap()
              $expected = $expectedIcon.ToBitmap()
              try {
                $checked = 0; $matching = 0
                for ($y = 0; $y -lt $expected.Height; $y++) {
                  for ($x = 0; $x -lt $expected.Width; $x++) {
                    $e = $expected.GetPixel($x, $y)
                    if ($e.A -lt 240) { continue }
                    $a = $actual.GetPixel($x, $y)
                    $checked++
                    if ([Math]::Abs([int]$a.R-$e.R) -le 4 -and [Math]::Abs([int]$a.G-$e.G) -le 4 -and [Math]::Abs([int]$a.B-$e.B) -le 4) { $matching++ }
                  }
                }
                if ($checked -lt 100 -or $matching / $checked -lt 0.96) { throw "Embedded icon differs from Muse artwork: $file" }
                Write-Host "Verified custom Muse icon in $file"
              } finally {
                $actual.Dispose(); $expected.Dispose(); $actualIcon.Dispose(); $expectedIcon.Dispose()
              }
            }
          } catch {
            $_ | Out-String | Add-Content test.log
            throw
          }
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: MuseVideoStudio-Windows
          path: MuseVideoStudio/dist/MuseVideoStudio-*-Windows.exe
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
      - name: Create download ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "MuseVideoStudio-$version-Windows.zip"
          Compress-Archive -Path "dist/MuseVideoStudio-$version-Windows.exe" -DestinationPath "dist/$zip" -CompressionLevel Optimal
          "MUSE_VERSION=$version" >> $env:GITHUB_ENV
          "MUSE_ZIP=$zip" >> $env:GITHUB_ENV
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "muse-studio-v$env:MUSE_VERSION" "dist/$env:MUSE_ZIP" --target $env:GITHUB_SHA --title "Muse Video Studio $env:MUSE_VERSION — Windows" --notes "Download ZIP, extract and run EXE. Fixes stale restored jobs skipping reference upload and prompt send, then jumping straight to old video downloads. Automatic recovery requires exact prompt and attempt identity; unbound old jobs submit the locked prompt and references first. Reused prompt drafts with no images now upload references. Opens the composer attachment menu for dynamic/hidden/detached file inputs in native and external browsers; prevents duplicate attachment and checks Stop. Requires current prompt and response evidence before download. Real Chromium integration verifies upload, exact prompt send, echo, generation wait, NEW video download and validated saved output. Preserves one Test All Browsers, four parallel inline cards and saved queues. Automated Windows/Edge fixtures passed; live Muse account validation remains needed. See MuseVideoStudio/README.md."
      - name: Retain public test diagnostics on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path test.log) {
            gh release create "muse-test-diagnostic-$env:GITHUB_RUN_ID" test.log --target $env:GITHUB_SHA --prerelease --title "Windows test diagnostics $env:GITHUB_RUN_ID" --notes "Public automated-test output for this app build; no customer Muse sessions or owner signing key are present in CI."
          }
