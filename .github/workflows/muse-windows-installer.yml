name: Build Muse Video Studio installer
on:
  workflow_dispatch:
  push:
    branches: [main, muse-video-studio]
    paths:
      - 'MuseVideoStudio/tools/build-installer.cjs'
      - 'MuseVideoStudio/tools/test-installer.ps1'
      - '.github/workflows/muse-windows-installer.yml'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MuseVideoStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MuseVideoStudio/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify application checks
        shell: cmd
        run: |
          call npm test > installer-test.log 2>&1
          set MUSE_TEST_EXIT=%ERRORLEVEL%
          type installer-test.log
          exit /b %MUSE_TEST_EXIT%
      - name: Build Windows setup
        shell: pwsh
        run: |
          node tools/build-installer.cjs 2>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installation, shortcuts, launch and uninstall
        shell: pwsh
        run: |
          & ./tools/test-installer.ps1 2>&1 | Tee-Object -FilePath installer-smoke.log
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseVideoStudio-Windows-Setup
          path: MuseVideoStudio/dist/MuseVideoStudio-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish setup download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "muse-studio-v$version" > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create "muse-studio-v$version" --target $env:GITHUB_SHA --title "Muse Video Studio V1 — $version Windows" --notes "Windows setup installer. Run the Setup.exe to choose an installation folder and create desktop/Start menu shortcuts."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "muse-studio-v$version" "dist/MuseVideoStudio-$version-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installer diagnostics on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $logs = @(Get-ChildItem -Path 'installer-*.log' | ForEach-Object { $_.FullName })
          if ($logs.Count -gt 0) {
            gh release create "muse-installer-diagnostic-$env:GITHUB_RUN_ID" @logs --target $env:GITHUB_SHA --prerelease --title "Installer diagnostics $env:GITHUB_RUN_ID" --notes "Automated installer build/test output. No customer sessions, prompts or owner private key are used in CI."
          }
