name: Dựng Auto Review Cutter+

on:
  push:
    branches: [scene-detect]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-scene-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------ 1. chạy thử phần tính toán cắt cảnh với ffmpeg thật
  logic-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cài ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Chạy thử (video giả có chỗ cắt đã biết)
        run: |
          mkdir -p _logs
          tools/host-test/run.sh 2>&1 | tee _logs/logic.log
      - name: Đẩy nhật ký
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_log.sh logic _logs/logic.log "${{ job.status }}"

  # ------------------------------------------------------------------ 2. dựng APK
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Dựng APK
        run: |
          mkdir -p _logs
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee _logs/apk-gradle.log
      - name: Kiểm tra APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          mkdir -p _apk
          cp "$APK" _apk/AutoReviewCutterPlus.apk
          {
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            "$BT/apksigner" verify --print-certs _apk/AutoReviewCutterPlus.apk || true
            "$BT/aapt2" dump badging _apk/AutoReviewCutterPlus.apk | head -n 12 || true
            unzip -l _apk/AutoReviewCutterPlus.apk | grep -E "lib/|classes" | head -n 30 || true
          } 2>&1 | tee _logs/apk-check.log
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReviewCutterPlus-apk
          path: _apk/AutoReviewCutterPlus.apk
          retention-days: 30
      - name: Đẩy nhật ký APK
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat _logs/apk-gradle.log _logs/apk-check.log > _logs/apk-final.log 2>/dev/null || true
          bash scripts/publish_log.sh apk _logs/apk-final.log "${{ job.status }}"

  # ------------------------------------------------------------------ 3. đăng lên Releases
  release:
    needs: [build, logic-test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoReviewCutterPlus-apk
          path: _apk
      - name: Tạo bản phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="scene-${{ github.run_number }}"
          gh release create "$TAG" _apk/AutoReviewCutterPlus.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Auto Review Cutter+ #${{ github.run_number }}" \
            --notes "Bản có nhận diện cảnh: cắt theo chỗ đổi cảnh, bỏ đoạn đen/đứng hình. Cài song song với app cũ (tên 'Auto Review Cutter+'). Chạy thử phần tính toán trên máy chủ: ${{ needs.logic-test.result }}. Chưa thử trên điện thoại thật."
