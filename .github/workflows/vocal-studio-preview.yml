name: Vocal Studio 1.9.5 Windows preview
on:
  workflow_dispatch:
  push:
    branches: [fix/vst3-discovery]
    paths: ['VocalStudio/**', '.github/workflows/vocal-studio-preview.yml']
concurrency:
  group: vocal-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            build/vocal
            build/vocal32
          key: vocal-preview156-${{ runner.os }}-${{ github.sha }}
          restore-keys: vocal-preview156-${{ runner.os }}-
      - name: Compile, test, package and verify installed app
        shell: pwsh
        run: |
          try { & './VocalStudio/scripts/build-windows.ps1' }
          catch {
            '### Windows build failure' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $_ | Out-String | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $_.ScriptStackTrace | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $detail = (($_ | Out-String) + $_.ScriptStackTrace).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows build failure::$detail"
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw
          }
      - name: Archive corresponding source
        shell: pwsh
        run: |
          & git archive '--format=zip' '--output=dist/VocalStudio-1.9.5-Source.zip' HEAD 'VocalStudio' '.github/workflows/vocal-studio-preview.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-1.9.5-Verified-Windows
          path: dist/
          if-no-files-found: error
      - name: Upload installer only
        uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-1.9.5-Installer
          path: |
            dist/VocalStudio-1.9.5-Setup.exe
            dist/DefenderReport.json
          if-no-files-found: error
      - name: Summarize build or native test failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($file in @('build/vocal/Compile32.log','build/vocal/Compile.log','build/vocal/CTest.log','build/vocal/EngineSelfTest.json','build/vocal/Testing/Temporary/LastTest.log')) {
            if (Test-Path $file) {
              "### $file" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $file -Tail 100 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $detail = ($file + "`n" + ((Get-Content $file -Tail 60) -join "`n"))
              if ($detail.Length -gt 10000) { $detail = $detail.Substring($detail.Length - 10000) }
              $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=Vocal build diagnostic::$detail"
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: VocalStudio-1.9.5-Diagnostics
          path: |
            build/vocal/Testing/Temporary/LastTest.log
            build/vocal/Compile32.log
            build/vocal/Compile.log
            build/vocal/CTest.log
            build/vocal/EngineSelfTest.json
            build/vocal/VocalStudio_artefacts/Release/Browser*.log
            build/vocal/VocalStudio_artefacts/Release/BrowserSelfTest.json
            dist/*SelfTest.json
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: failure()
        with:
          path: |
            build/vocal
            build/vocal32
          key: vocal-preview156-${{ runner.os }}-${{ github.sha }}-diagnostic
