name: Chua Viet Online - Android APK

on:
  workflow_dispatch:
  push:
    branches: [chua-viet-online]
    paths:
      - 'ChuaVietOnline/**'
      - '.github/workflows/chua-viet-online-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test multiplayer server
        shell: bash
        run: |
          set -euo pipefail
          cd ChuaVietOnline/realtime
          npm ci --omit=dev
          npm test
      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chua-viet-online-debug-signing-v1
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          echo "GODOT_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0"
      - name: Import Godot project
        run: godot --headless --path ChuaVietOnline --editor --quit
      - name: Configure Godot editor SDK settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path.home() / ".config/godot/editor_settings-4.3.tres"
          path.parent.mkdir(parents=True, exist_ok=True)
          sdk = os.environ["ANDROID_HOME"]
          java = os.environ["JAVA_HOME"]
          path.write_text(
              '[gd_resource type="EditorSettings" format=3]\n\n'
              '[resource]\n'
              f'export/android/android_sdk_path = "{sdk}"\n'
              f'export/android/java_sdk_path = "{java}"\n'
              'export/android/debug_keystore = "' + str(pathlib.Path.home() / '.android/debug.keystore') + '"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n'
          )
          print(path.read_text())
          PY
          test -f "$ANDROID_HOME/build-tools/33.0.2/aapt"
          test -f "$HOME/.android/debug.keystore"
      - name: Validate Godot scripts and scene loading
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path ChuaVietOnline --editor --quit 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Parser Error" godot-validation.log; then
            echo "Godot script validation failed" >&2
            exit 1
          fi
      - name: Smoke test actual game startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s godot --headless --path ChuaVietOnline --quit-after 20 2>&1 | tee godot-runtime.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Parser Error|Invalid call|Invalid get index|ERROR:" godot-runtime.log; then
            echo "Godot runtime smoke test failed" >&2
            exit 1
          fi
      - name: Test game interactions
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path ChuaVietOnline --script res://tests/interaction_test.gd 2>&1 | tee godot-interactions.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Assertion failed|Invalid call|ERROR:" godot-interactions.log; then
            exit 1
          fi
          grep -q "PASS: 1000 seat projections" godot-interactions.log
      - name: Test Godot clients against realtime server
        shell: bash
        run: |
          set -euo pipefail
          node ChuaVietOnline/realtime/server.js > realtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          timeout 30s godot --headless --path ChuaVietOnline --script res://tests/network_test.gd 2>&1 | tee godot-network.log
          if grep -Ei "SCRIPT ERROR|Assertion failed|ERROR:" godot-network.log; then
            exit 1
          fi
          grep -q "PASS: Godot clients handshake" godot-network.log
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record actual game rituals under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ChuaVietOnline/build
          timeout 120s xvfb-run -a -s "-screen 0 720x1280x24" godot --path ChuaVietOnline --script res://tests/render_test.gd --audio-driver Dummy 2>&1 | tee godot-render.log
          if grep -Ei "SCRIPT ERROR|Assertion failed|ERROR:" godot-render.log; then exit 1; fi
          grep -q "PASS: real viewport recorded" godot-render.log
          ffmpeg -v error -y -framerate 20 -i ChuaVietOnline/build/review_frames/frame_%04d.png -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p ChuaVietOnline/build/ritual-preview.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChuaVietOnline-ritual-review
          path: |
            ChuaVietOnline/build/*.png
            ChuaVietOnline/build/ritual-preview.mp4
          if-no-files-found: error
      - name: Save screenshots to project documentation
        shell: bash
        run: |
          set -euo pipefail
          cp ChuaVietOnline/build/*.png ChuaVietOnline/docs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChuaVietOnline/docs/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Update actual ritual screenshots [skip ci]"
            git push origin HEAD:chua-viet-online
          fi
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ChuaVietOnline/build
          godot --headless --verbose --path ChuaVietOnline --export-debug Android build/ChuaVietOnline-debug.apk
          test -s ChuaVietOnline/build/ChuaVietOnline-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChuaVietOnline-debug-APK
          path: ChuaVietOnline/build/ChuaVietOnline-debug.apk
          if-no-files-found: error
      - name: Verify packaged animation metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -l ChuaVietOnline/build/ChuaVietOnline-debug.apk | grep 'art/ritual_atlases.json'
