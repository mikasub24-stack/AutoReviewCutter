name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 837b4cd95539d8e2c6e47dc7cf6ac8928639406b
      SOURCE_RUN: '41744762810'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release/dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Review --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Verification artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          $browser = Get-Content release/BrowserSelfTest.json -Raw | ConvertFrom-Json
          $installedBrowser = Get-Content release/dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed -or !$browser.passed -or !$installedBrowser.passed) { throw 'Native, browser or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          Copy-Item release/BrowserSelfTest.json release/dist/BrowserSelfTest.json
          $files = @('release/dist/VocalStudio-1.4.0-Setup.exe','release/dist/VocalStudio-1.4.0-Windows.zip','release/dist/VocalStudio-1.4.0-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-Polish.jpg','release/dist/VocalStudio-AutoEQ.jpg','release/dist/VocalStudio-Studio.jpg','release/dist/BrowserSelfTest.json','release/dist/InstalledBrowserSelfTest.json','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.4.0 Windows x64 — tăng cường xử lý riêng giọng và xuất WAV vocal có FX để hát thử/đối chiếu.

          Mới: Vocal studio → Áp dụng preset Studio. Giữ EQ riêng/input gain và cấu hình Antares; chọn compressor vừa, reverb nhẹ/pre-delay và delay nhỏ, bật ba bước xử lý mới. Cân câu nhỏ/to chậm trước compressor (tối đa +4/−6 dB ở 100%, không nâng gain dưới ngưỡng detector −40 dBFS); dịu gắt động quanh 3,5 kHz; reverb/delay lùi khi hát và trả đuôi khi ngắt câu. Điều chỉnh độc lập 0–100%, có bật/tắt ba bước để so. Thay lượng có làm mượt; không thêm lookahead. Không xử lý các bước này lên nhạc YouTube/beat.

          Mới: Xuất WAV vocal có FX. Thu micro/chọn track vocal, dừng rồi xuất: lấy WAV gốc qua EQ/dynamics/Antares/vang hiện tại, bù latency, đủ đuôi vang, lưu PCM stereo 24-bit. Không kèm YouTube/track khác, không phụ thuộc mute/solo timeline và không ghi đè nguồn gốc/lịch sử. Có tiến độ/hủy ngay trong bảng; hủy giữ file đích cũ. Nghe thành phẩm này để phản hồi, phân biệt với nút Thu vẫn lưu micro khô. Muốn mix với beat của bạn hoặc giữ pitch offline đang chọn, dùng Xuất WAV Studio như trước. Key/Scale/plugin dùng thiết lập hiện tại; lịch sử đổi key/automation lúc thu chưa được tái tạo tự động.

          Giữ AutoEQ 1.3: hát một bài, đề xuất EQ nhẹ từ micro khô, nghe A/B riêng nguồn gốc và chỉ lưu B khi chấp nhận; preset tại máy, WAV không đổi. Giữ YouTube trong tool, đổi từng nửa cung giữ tempo, gửi Key/Scale cho Antares VST3 đã ghép; không cần cáp âm thanh ảo/tiện ích. Antares và giấy phép không kèm; plugin cần công khai/xác nhận tham số. Dự án cũ mặc định ba bước mới bằng 0, giữ tiếng cũ tới khi bạn bật.

          UPod Pro: Windows Audio/WASAPI 48 kHz; Mic with DSP OFF, Mixing OFF; tai nghe qua card, tắt Direct Out/Direct Out+DSP khi nghe FX phần mềm. Card USB 16-bit; WAV 24-bit không nâng độ phân giải ADC. Chỉnh gain vật lý để tránh clip. Cân mức không phải khử ồn; không thể tái tạo hoàn toàn âm đã vỡ.

          Kiểm thử Windows: 7 bộ CTest, gồm cân chênh mức câu hát, sai số hài trên tín hiệu đều, giữ trầm/giảm dải gắt, nền nhỏ lúc nghỉ, duck/đuôi vang, bypass và chuyển lượng; vocal-only export bỏ backing/mute/solo, bảo vệ WAV gốc/lịch sử và file đích khi hủy; giữ EQ riêng, save/load bước mới và tương thích dự án cũ; toàn bộ AutoEQ/Pitch/VoiceFit/LiveMusic/Engine/VST3 fixture/Chromium/installer trước đó. Kèm source ZIP, ảnh chạy thật, log/JSON và checksum.

          Đây là bản cải thiện để người dùng hát thử và phản hồi. Kiểm thử tín hiệu không xác nhận chất lượng tương đương clip TikTok, không chứng nhận âm thanh đạt chuẩn phát hành. Chưa nghe thử giọng thật/UPod Pro/Antares có giấy phép của người dùng. Cần nghe A/B theo bài, cách hát, mic và phòng; không tự sao chép giọng hay chuỗi plugin từ bản mix tham chiếu.

          Source đã build: $env:SOURCE_SHA
          Actions: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later; dependency ghim phiên bản. Phân tích/preset/bản thu nằm trên máy; trình duyệt không được cấp quyền micro/camera.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.4.0 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.4.0 · Vocal studio và WAV có FX' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
