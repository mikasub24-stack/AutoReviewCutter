name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 4f69dc090c66af167001c8fc0b2319b28564e167
      SOURCE_RUN: '41616664063'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed) { throw 'Native or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          $files = @('release/dist/VocalStudio-1.1.0-Setup.exe','release/dist/VocalStudio-1.1.0-Windows.zip','release/dist/VocalStudio-1.1.0-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.1.0 cho Windows x64 — thu và mix vocal cá nhân với sound card rời + micro.

          MỚI: Theo giọng tôi. Thu mẫu giọng 20 giây, dùng vocal của chính bạn hoặc đặt vùng thoải mái bằng tay. So với vocal mẫu/humming theo tone gốc của bài, đề xuất đổi beat ±6 bán âm và chọn quãng tám hát. Đổi đồng thời các beat/stem chưa mute, giữ tempo và WAV gốc. Không lấy nốt bass của beat làm quãng hát, không nhận là đã khớp khi bài vượt vùng đo.

          MỚI: Antares Key/Scale. Tự nhận diện 12 nốt và Major/Natural Minor qua nhãn tham số VST3, hoặc học giá trị từ plugin bạn đang dùng. Gửi tone sau dò/chuyển beat và đọc lại xác nhận. Nếu tone bài mới chưa rõ hoặc gửi không được xác nhận, app giữ bypass thay vì dùng tone bài trước; xác nhận mới chỉ tự bật lại bypass do cơ chế giữ, không ghi đè bypass bạn tự chọn. Mapping lưu theo ID và định danh/phiên bản plugin; không đoán thứ tự núm, không gửi mapping thiếu/sai. Hỗ trợ cập nhật điều khiển công khai khi dừng transport dù plugin không cho automation liên tục, có đọc lại xác nhận. Không kèm Antares hoặc giấy phép. Khi plugin không công khai Key/Scale, host không thể cưỡng ép gửi.

          GIẢM MÉO: giữ formant dựa trên cao độ đo được của clip; chặn chỉnh phô hai lần khi Antares đang hoạt động; host bypass để nghe đối chiếu và bỏ cả trễ plugin; hỗ trợ bus mono/stereo, không cộng đôi mức khi trộn về mono; đo giọng bằng micro gốc, bỏ qua beat/vang/Antares mà không sửa mute đã lưu; mẫu đo được giữ riêng và mute mặc định, kể cả khôi phục sau gián đoạn. Sửa clip nhẹ vẫn có giới hạn; vỡ nặng/overload analog không khôi phục hoàn toàn.

          Giữ các chức năng 1.0: WAV 24-bit gốc, ASIO, timeline, EQ/compressor/de-esser/reverb/echo 16 núm, VST3, dò tone/chỉnh phô sau thu, chuyển ±12 bán âm và ±50 cent giữ tempo, phục hồi bản gốc và dự án, xuất WAV stereo có đủ đuôi vang.

          Đã kiểm thử Windows: DSP/Pitch/VoiceFit/Engine, 12 Key và 2 scale có thứ tự xáo trộn qua VST3 fixture thật, guard mapping/double tune, bypass/PDC, lưu/khôi phục range và mapping, bộ cài. Có log, ảnh giao diện chạy thật, mã nguồn và checksum. Chưa thử bản Antares có giấy phép và sound card/micro của người dùng; không khẳng định mọi phiên bản Antares hỗ trợ cùng tham số.

          Bắt đầu: cài Setup.exe hoặc giải nén Windows.zip → Sound card: chọn ASIO/input micro → Vang / Tone / Chỉnh phô → Theo giọng tôi → đo giọng/chọn vocal mẫu và beat → xem đề xuất → Antares Key/Scale: nạp/ghép plugin. Bật Kiểm âm FX và dùng tai nghe để hát qua Antares. Xem README trong gói để tránh kiểm âm kép, đặt gain và hiểu giới hạn dò tone.

          Mã nguồn đã build: $env:SOURCE_SHA
          Kiểm chứng: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later, kèm source ZIP và định danh dependency cố định. Không kèm plugin thương mại. Dữ liệu âm thanh lưu trên máy.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.1.0 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.1.0 · Windows preview' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
