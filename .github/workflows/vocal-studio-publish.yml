name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 767723801d4b564da4f693e6feb5271b8cddb65b
      SOURCE_RUN: '41746266475'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release/dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Review --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Verification artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          $browser = Get-Content release/BrowserSelfTest.json -Raw | ConvertFrom-Json
          $installedBrowser = Get-Content release/dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed -or !$browser.passed -or !$installedBrowser.passed) { throw 'Native, browser or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          Copy-Item release/BrowserSelfTest.json release/dist/BrowserSelfTest.json
          $files = @('release/dist/VocalStudio-1.4.1-Setup.exe','release/dist/VocalStudio-1.4.1-Windows.zip','release/dist/VocalStudio-1.4.1-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-Polish.jpg','release/dist/VocalStudio-AutoEQ.jpg','release/dist/VocalStudio-Studio.jpg','release/dist/BrowserSelfTest.json','release/dist/InstalledBrowserSelfTest.json','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.4.1 Windows x64 — sửa tầng khuếch tán reverb trên bản 1.4.

          Sửa công thức hồi tiếp của hai tầng all-pass: chỉ khuếch tán pha/đuôi vang, không tăng mức theo tần số ngoài ý muốn. Bản trước dùng mẫu trễ thay cho đầu ra all-pass trong nhánh hồi tiếp. Mức/màu reverb có thể khác sau sửa; nghe lại và chỉnh lượng Reverb theo ý. Không thêm latency, giữ đường EQ/dynamics → Antares → ambience, chỉ trên vocal.

          Kiểm thử mới: đáp ứng xung bảo toàn năng lượng; biên độ ổn định 73/220/1000/3500/8000 Hz tại 44,1/48/96 kHz; reset sạch đuôi. Test mới thất bại với công thức cũ, đạt với công thức sửa. Chạy lại 7 bộ CTest, native/Chromium audio và bản cài đặt; kèm ảnh chạy thật, log/JSON, mã nguồn và checksum.

          Giữ tính năng 1.4: cân câu hát nhỏ/to, dịu gắt động, vang né giọng, preset Studio giữ EQ riêng/Antares, xuất riêng WAV vocal PCM stereo 24-bit có FX và đuôi vang từ micro gốc. Giữ AutoEQ A/B, YouTube trong app, đổi từng nửa cung giữ tempo và gửi Key/Scale tới VST3 đã ghép. Xuất vocal không kèm YouTube/beat; dùng thiết lập plugin hiện tại, chưa tái tạo lịch sử automation/đổi key khi thu. Bản thu khô và nguồn/lịch sử được giữ nguyên.

          UPod Pro: Windows Audio/WASAPI 48 kHz, tai nghe qua card, Mic with DSP OFF và Mixing OFF; tắt Direct Out/Direct Out+DSP khi nghe FX phần mềm. Giảm gain vật lý nếu clip. Antares và giấy phép không kèm; plugin phải công khai/xác nhận Key/Scale phù hợp.

          Đây là bản sửa thuật toán để người dùng nghe thử và phản hồi. Chưa kiểm chứng bằng giọng thật/UPod Pro/Antares có giấy phép của người dùng; kiểm thử phần mềm không chứng minh chất lượng tương đương clip TikTok hay đạt chuẩn phát hành. Không thể phục hồi hoàn toàn âm đã vỡ tại đầu vào.

          Source đã build: $env:SOURCE_SHA
          Actions: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later; dependency ghim phiên bản. Phân tích/preset/bản thu nằm trên máy; trình duyệt không được cấp quyền micro/camera.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.4.1 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.4.1 · Sửa khuếch tán reverb' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
