name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 509546fe0620cb5bf61dada049a5ead5b9d80e2a
      SOURCE_RUN: '41879875919'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release/dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Review --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Verification artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          $browser = Get-Content release/BrowserSelfTest.json -Raw | ConvertFrom-Json
          $installedBrowser = Get-Content release/dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed -or !$browser.passed -or !$installedBrowser.passed) { throw 'Native, browser or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          Copy-Item release/BrowserSelfTest.json release/dist/BrowserSelfTest.json
          $files = @('release/dist/VocalStudio-1.5.0-Setup.exe','release/dist/VocalStudio-1.5.0-Windows.zip','release/dist/VocalStudio-1.5.0-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-Polish.jpg','release/dist/VocalStudio-FixAutoTune.jpg','release/dist/VocalStudio-AutoEQ.jpg','release/dist/VocalStudio-Studio.jpg','release/dist/BrowserSelfTest.json','release/dist/InstalledBrowserSelfTest.json','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.5.0 Windows x64 — nút Fix méo Auto-Tune và bảng báo cáo/hoàn tác.

          Màn hình hát có Fix méo Auto-Tune → Áp dụng · Kéo nhẹ hơn. Dừng phát/thu/nghe bản thu; nạp VST3, ghép và chọn/dò đúng tone bài trước. Tool xác nhận Key/Scale hiện tại (đã theo số bán âm của nhạc ở chế độ YouTube), rồi đặt Retune tối thiểu 35 ms, Humanize tối thiểu 50%, Flex-Tune tối thiểu 20%, bật Formant nếu plugin công khai các điều khiển/đơn vị/nhãn rõ. Giữ mức retune/humanize/flex đã nhẹ hơn; không đổi Input Type/quãng giọng, Transpose hay Formant Shift. Không tự bật plugin đang bypass.

          Nếu không xác minh được Retune theo ms thì không chỉnh nhóm tham số kéo giọng. Tùy chọn không hỗ trợ giữ nguyên và báo rõ. Đọc lại giá trị sau khi chỉnh, trả nhóm tham số về trước nếu plugin không xác nhận. Có Hoàn tác trong phiên hiện tại, không ghi đè nếu người dùng đã chỉnh tiếp trong plugin; thay/nạp lại plugin/dự án bỏ lịch sử hoàn tác. Thiết lập đã áp dụng được lưu trong project qua trạng thái VST3. File thu không đổi. Đây là preset khởi đầu giảm kiểu kéo gắt, không đảm bảo hết mọi méo và không cứu clipping.

          Kèm ảnh giao diện chạy thật VocalStudio-preview.jpg và VocalStudio-FixAutoTune.jpg, Source ZIP riêng chứa VocalStudio/CMakeLists.txt + source + docs để mở/build độc lập với game trong cùng repo/nhánh vocal-studio. App Windows chạy riêng, không cần mở mã nguồn hoặc dự án Chùa Việt.

          Kiểm thử: 7 bộ CTest, thêm actual VST3 fixture kiểm tra retune theo ms với thang phi tuyến, humanize/flex/formant, giữ tone sau đổi, giữ thiết lập nhẹ hơn, undo/manual-edit/bypass/transport guard và từ chối plugin không hỗ trợ; giữ toàn bộ kiểm thử DSP/reverb, pitch, raw recording, project, vocal-only export, Chromium audio và installer. Antares thương mại không kèm; chưa kiểm thử đúng phiên bản có giấy phép trên máy người dùng/UPod Pro thật, không cam kết chất lượng tương đương clip TikTok.

          Giữ YouTube trong app, ±½ cung mỗi lần giữ tempo, AutoEQ A/B, preset Studio, vang né giọng và WAV vocal có FX. Chỉ một tuner realtime trên vocal; không thể tự gỡ Auto-Tune đã in sẵn vào file, dùng micro/WAV gốc. Dò tone có thể nhầm Major/Minor hoặc bài chuyển giọng; kiểm tra/chọn tay khi cần. Xuất dùng trạng thái plugin/key hiện tại, không tái tạo lịch sử automation chưa ghi.

          UPod Pro: Windows Audio/WASAPI 48 kHz, Mic with DSP OFF, Mixing OFF; tai nghe qua card, tắt Direct Out/Direct Out+DSP khi nghe FX phần mềm. Giảm gain vật lý nếu mic clip.

          Source đã build: $env:SOURCE_SHA
          Actions: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later; dependency ghim phiên bản. Phân tích/preset/bản thu nằm trên máy; trình duyệt không được cấp quyền micro/camera.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.5.0 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.5.0 · Fix méo Auto-Tune' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
