name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: d7f9d644c6c1287fb974d8a71ba22b9d807a2320
      SOURCE_RUN: '41658392635'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release/dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Review --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Verification artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          $browser = Get-Content release/BrowserSelfTest.json -Raw | ConvertFrom-Json
          $installedBrowser = Get-Content release/dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed -or !$browser.passed -or !$installedBrowser.passed) { throw 'Native, browser or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          Copy-Item release/BrowserSelfTest.json release/dist/BrowserSelfTest.json
          $files = @('release/dist/VocalStudio-1.2.0-Setup.exe','release/dist/VocalStudio-1.2.0-Windows.zip','release/dist/VocalStudio-1.2.0-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-Studio.jpg','release/dist/BrowserSelfTest.json','release/dist/InstalledBrowserSelfTest.json','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.2.0 Windows x64 — mở YouTube trong tool, bấm nửa cung rồi hát.

          Dán link hoặc tìm bài karaoke, bật micro; −½ cung / +½ cung đổi đúng một bán âm mỗi lần, giữ tốc độ; Về tone gốc trả về 0. Không bắt nhập beat, đo quãng giọng hoặc chọn vocal mẫu. Có âm lượng nhạc/micro, Reverb/Delay, preset Vang ẩn và menu FX chi tiết. Studio nâng cao giữ các chức năng thu/mix/xuất WAV của 1.1.

          Chromium đi kèm và có sandbox; chỉ âm thanh của YouTube mở trong tool đi qua bộ đổi tone. Không cần cáp âm thanh ảo/tiện ích; tab Chrome/Edge bên ngoài không đi qua tool. YouTube cần mạng và có thể yêu cầu đồng ý cookie/đăng nhập/xác minh; app không vượt xác minh, tải/tách stream hoặc loại quảng cáo. Video cần DRM/codec không có trong CEF có thể không phát.

          Tự dò key từ nhạc gốc, cộng mức chuyển đúng một lần và gửi Key/Scale sang Antares VST3 đã ghép trong lúc hát/thu. Bài mới/quảng cáo/seek xóa tone cũ. Có Key/Scale gốc chọn tay khi tự dò không rõ hoặc nhầm trưởng/thứ tương đối. Không kèm Antares/giấy phép; plugin phải công khai và xác nhận tham số, nếu không app báo và tạm bypass. EQ/compressor/de-esser trước Antares; reverb/delay sau Antares để tiếng vang không làm rối bộ dò nốt.

          UPod Pro: USB 16-bit/48 kHz plug-and-play; chọn Windows Audio/WASAPI và input/output phù hợp một lần, ứng dụng lưu lại. Phần cứng: Mic with DSP OFF, Mixing OFF; tắt Direct Out/Direct Out+DSP khi nghe FX phần mềm; dùng tai nghe. Không bắt cài driver ASIO không có của hãng. Giảm gain vật lý khi clip; không phục hồi hoàn toàn giọng vỡ/quá tải đầu vào. WAV 24-bit không nâng độ phân giải ADC 16-bit của card.

          Thu giọng lưu WAV micro gốc, không ghi nhạc YouTube hoặc hiệu ứng vào WAV này. Mở Studio để mix với beat của bạn và xuất file.

          Kiểm chứng kèm log/JSON/ảnh chạy thật: DSP/Pitch/LiveMusic/VoiceFit/Engine, ±1 bán âm và quãng tám giữ thời lượng/stereo, dò key gốc khi nhạc đã đổi tone, VST3 fixture thật đổi 12 Key/Scale khi đang thu, Chromium audio capture và bộ cài. Chưa thử UPod Pro hoặc bản Antares có giấy phép trên máy người dùng; không cam kết mọi plugin/version hỗ trợ giống nhau.

          Mã nguồn đã build: $env:SOURCE_SHA
          Kiểm chứng: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later; kèm source ZIP và dependency ghim phiên bản. Bản thu/micro lưu tại máy. Trình duyệt kết nối tới YouTube như bình thường và không được cấp quyền micro/camera.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.2.0 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.2.0 · YouTube và nửa cung' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
