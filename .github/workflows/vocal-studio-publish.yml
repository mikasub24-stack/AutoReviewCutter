name: Publish reviewed Vocal Studio Windows build
on:
  workflow_dispatch:
  push:
    branches: [vocal-studio]
    paths: ['.github/workflows/vocal-studio-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 8d254d98897dd2bec9457f988a0eab9877963e4e
      SOURCE_RUN: '41666829039'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed source and successful build
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Reviewed Windows build is not successful' }
          $compiledTree = git rev-parse "${env:SOURCE_SHA}:VocalStudio"
          $currentTree = git rev-parse HEAD:VocalStudio
          if ($LASTEXITCODE -ne 0 -or $compiledTree -ne $currentTree) { throw 'Application source differs from reviewed build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Windows --dir release/dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name VocalStudio-Review --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Verification artifact download failed' }
          $engine = Get-Content release/build/vocal/EngineSelfTest.json -Raw | ConvertFrom-Json
          $installed = Get-Content release/dist/InstalledSelfTest.json -Raw | ConvertFrom-Json
          $browser = Get-Content release/BrowserSelfTest.json -Raw | ConvertFrom-Json
          $installedBrowser = Get-Content release/dist/InstalledBrowserSelfTest.json -Raw | ConvertFrom-Json
          if (!$engine.passed -or !$installed.passed -or !$browser.passed -or !$installedBrowser.passed) { throw 'Native, browser or installed self-test failed' }
      - name: Publish installer, portable, source, screenshot and verification
        shell: pwsh
        run: |
          Copy-Item release/build/vocal/Testing/Temporary/LastTest.log release/dist/VocalStudio-Verification.log
          Copy-Item release/BrowserSelfTest.json release/dist/BrowserSelfTest.json
          $files = @('release/dist/VocalStudio-1.3.0-Setup.exe','release/dist/VocalStudio-1.3.0-Windows.zip','release/dist/VocalStudio-1.3.0-Source.zip','release/dist/VocalStudio-preview.jpg','release/dist/VocalStudio-AutoEQ.jpg','release/dist/VocalStudio-Studio.jpg','release/dist/BrowserSelfTest.json','release/dist/InstalledBrowserSelfTest.json','release/dist/VocalStudio-FX.jpg','release/dist/VocalStudio-Tone.jpg','release/dist/VocalStudio-VoiceFit.jpg','release/dist/VocalStudio-Antares.jpg','release/dist/VocalStudio-Verification.log','release/dist/InstalledSelfTest.json','release/build/vocal/EngineSelfTest.json')
          $sums = foreach ($file in $files) { $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content release/dist/SHA256SUMS.txt -Encoding ascii
          $notes = @"
          Vocal Studio 1.3.0 Windows x64 — hát một bài, phân tích micro khô và nghe A/B EQ riêng.

          Mới: Hát 1 bài → Cân EQ. Thu khi hát YouTube, bấm Dừng để phân tích; hoặc chọn vocal của chính bạn trong Studio. Phân tích từ WAV micro gốc, tối đa 12 đoạn 5 giây trải đều bài. Đề xuất low-cut giữ nền giọng thấp, độ ấm, giảm chói và de-esser với mức chỉnh nhẹ; chưa áp dụng cho tới khi bạn nghe B. Mẫu quá ngắn, ít giọng rõ, tiếng ù đều, nhiễu không có giọng hoặc clip nhiều bị từ chối. Đây là gợi ý theo thống kê bản thu, không phải học một EQ chuẩn phát hành hay sao chép giọng ca sĩ.

          Nghe bản thu A/B phát riêng WAV micro gốc qua FX hiện tại, không nghe lẫn mic trực tiếp hoặc track khác, không sửa mute/solo dự án. YouTube được tạm dừng lúc nghe lại. A/B chỉ thay EQ/de-esser và gain bù mức ước tính tối đa ±3 dB; giữ compressor, vang và Antares. Lưu B làm EQ riêng mới xác nhận preset; đóng cửa sổ/Về EQ đang lưu bỏ phần nghe thử chưa lưu. Autosave không biến B nghe thử thành EQ đã chấp nhận sau khi mở lại dự án. WAV gốc được giữ nguyên.

          EQ đã lưu nằm trên máy, có thể nạp cho phiên khác. Đo lại khi đổi micro, khoảng cách hoặc phòng. Không đổi nốt/kéo giọng cao bằng EQ; dùng Antares/công cụ pitch cho phần đó. Không tự tách được beat hoặc DSP đã trộn từ phần cứng; không phục hồi hoàn toàn giọng vỡ analog và không cam kết chất lượng phát hành sau một lần hát.

          Giữ tính năng 1.2: YouTube ngay trong tool; −½ cung / +½ cung đổi một bán âm mỗi lần, giữ tốc độ; Về tone gốc; tự dò tone nhạc gốc và gửi Key/Scale cho Antares VST3 đã ghép. Vang ẩn, Reverb/Delay và menu FX, Studio nâng cao thu/mix/xuất WAV. Không cần cáp âm thanh ảo/tiện ích. Tab Chrome/Edge bên ngoài không đi qua bộ đổi tone. Video YouTube cần mạng, có thể yêu cầu xác minh/đăng nhập hoặc codec/DRM không có trong CEF.

          UPod Pro: Windows Audio/WASAPI 48 kHz, đúng ngõ micro; Mic with DSP OFF, Mixing OFF; dùng tai nghe, tắt Direct Out/Direct Out+DSP khi nghe FX phần mềm. Chọn một lần rồi lưu lại. Không bắt cài ASIO hãng không có. Thu giọng lưu micro khô, không ghi nhạc YouTube vào WAV gốc. Antares/giấy phép phải có sẵn; plugin cần công khai và xác nhận Key/Scale.

          Đã kiểm thử Windows: 6 bộ CTest (AutoEQ, DSP, Pitch, LiveMusic, VoiceFit, Engine); phản ứng với tăng bass/tăng chói, thay đổi âm lượng, chặn im lặng/nhiễu/ù đều/clip, hủy tác vụ; phát A/B chỉ nghe nguồn gốc; lưu EQ đã chấp nhận trong khi vẫn nghe preview; round-trip dự án; VST3 fixture đổi 12 Key/Scale lúc thu; Chromium audio và bản cài. Có ảnh giao diện thật, JSON/log/checksum. Chưa thử giọng thật, UPod Pro hoặc Antares có giấy phép của người dùng.

          Source đã build: $env:SOURCE_SHA
          Actions: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN
          Source ứng dụng AGPL-3.0-or-later; kèm source ZIP và dependency ghim phiên bản. Phân tích giọng/preset/bản thu nằm trên máy; trình duyệt không được cấp quyền micro/camera.
          "@
          $notes | Set-Content release/notes.md -Encoding utf8
          $files += 'release/dist/SHA256SUMS.txt'
          gh release create vocal-studio-v1.3.0 @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Vocal Studio 1.3.0 · EQ giọng tôi' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Export publication source graph for workspace
        shell: pwsh
        run: |
          git bundle create VocalStudio-publication.bundle HEAD ^4da27243521a32aa05b77cccdfcff6b5de479efc
          if ($LASTEXITCODE -ne 0) { throw 'Publication source bundle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-publication-source
          path: VocalStudio-publication.bundle
