name: Publish Chua Viet Online APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Chua Viet Online Android build run
        required: true
        default: '41546344456'
      version:
        description: APK version
        required: true
        default: '0.3.0'
  push:
    branches: [chua-viet-online]
    paths: ['.github/workflows/chua-viet-online-release.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id || '41546344456' }}
      APK_VERSION: ${{ inputs.version || '0.3.0' }}
    steps:
      - name: Validate source build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$APK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e '.conclusion == "success" and .head_branch == "chua-viet-online" and .name == "Chua Viet Online - Android APK"' run.json
          echo "SOURCE_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ChuaVietOnline-debug-APK
          path: apk
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Download real game recording
        uses: actions/download-artifact@v4
        with:
          name: ChuaVietOnline-ritual-review
          path: review
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Publish direct APK download
        shell: bash
        run: |
          set -euo pipefail
          source_apk=$(find apk -name '*.apk' -type f -print -quit)
          test -s "$source_apk"
          asset="ChuaVietOnline-$APK_VERSION-debug.apk"
          cp "$source_apk" "$asset"
          tag="chua-viet-online-v$APK_VERSION"
          cat > notes.md <<'NOTES'
          Bản cài thử Android 0.3.0 (debug, arm64).

          - Quỳ / Đứng, Lạy Phật, Chắp tay, Ngồi thiền, Niệm Phật và Thắp hương thực hiện trực tiếp bằng nhân vật trong chính điện.
          - Chuỗi lạy: chắp tay, hạ gối, quỳ, cúi, phủ phục rồi về quỳ. Chỉ hoàn thành đủ chuỗi mới tăng số lạy; di chuyển hoặc Dừng sẽ ngắt nghi thức.
          - Cảnh và giao diện cố định khi đi; joystick cảm ứng không còn bị sự kiện chuột mô phỏng chiếm điều khiển.
          - Tên/pháp danh do từng người tự đặt, được lưu và đồng bộ.

          Video ritual-preview.mp4 và các ảnh JPG được quay/chụp từ viewport của chính game bằng các nút hành động thật.

          Lưu ý cài đặt: bản 0.2.x dùng khóa ký debug cũ. Nếu Android báo xung đột chữ ký, cần gỡ bản cũ trước khi cài; gỡ ứng dụng sẽ xóa tiến trình đang lưu trên thiết bị.

          APK lấy từ build GitHub Actions đã kiểm thử thành công. Chưa kiểm thử trên điện thoại vật lý; chưa cấu hình máy chủ Internet công khai; cửa hàng vẫn là sandbox.
          NOTES
          printf '\nCommit APK đã kiểm thử: %s\n' "$SOURCE_SHA" >> notes.md
          gh release create "$tag" "$asset" review/ritual-preview.mp4 review/temple-preview.jpg review/ritual-kneel.jpg review/ritual-bow.jpg review/ritual-incense.jpg --target "$GITHUB_SHA" --title "Chùa Việt Online $APK_VERSION — Android thử nghiệm" --notes-file notes.md --prerelease --latest=false
      - uses: actions/checkout@v4
        if: always()
        with:
          ref: chua-viet-online
      - name: Package source history for handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin chua-viet-online
          git bundle create ChuaVietOnline-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChuaVietOnline-source-bundle
          path: ChuaVietOnline-source.bundle
          if-no-files-found: error
